name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.11.0

      # pnpm 11 necesita Node 22.13 o superior: instala y compila siempre con Node 24.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Auditoría de dependencias, lint y tipos
        if: matrix.node == 24
        run: |
          pnpm audit --audit-level=high
          pnpm lint
          pnpm typecheck
          pnpm pack --dry-run

      # El SDK promete Node 20 o superior: los tests y el paquete compilado corren con cada versión.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Tests con Node ${{ matrix.node }}
        run: node node_modules/vitest/vitest.mjs run

      - name: El paquete carga en CJS y en ESM
        run: |
          node -e "const m = require('./dist/index.js'); if (typeof m.createPaymentAdapter !== 'function') process.exit(1)"
          node --input-type=module -e "const m = await import('./dist/index.mjs'); if (typeof m.createPaymentAdapter !== 'function') process.exit(1)"
