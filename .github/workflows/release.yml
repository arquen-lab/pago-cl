name: Release

# Se dispara al subir un tag vX.Y.Z. Publica en npm y crea el GitHub Release.
# La publicación usa trusted publishing: npm autentica a este workflow por OIDC (sin token) y genera el
# provenance que enlaza cada versión con este repositorio. Hay que configurarlo una vez en npm:
# paquete → Settings → Trusted publisher → GitHub Actions (arquen-lab/pago-cl, release.yml, environment npm).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # crear el release
  id-token: write   # OIDC para el trusted publishing y el provenance de npm

jobs:
  release:
    runs-on: ubuntu-latest
    # Entorno con aprobación manual: el release no avanza hasta que alguien lo aprueba
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.11.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: El tag coincide con package.json
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión de package.json ($PACKAGE)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Notas desde el CHANGELOG
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 == "## " v { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md no tiene una sección '## ${{ steps.version.outputs.version }}'"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # `npm publish` desde el tarball y fuera del proyecto: es el que soporta trusted publishing y provenance
      # (pnpm publish no genera provenance), y así npm no revisa el devEngines de pnpm del package.json.
      - name: Empaquetar
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"

      - name: Publicar en npm
        working-directory: ${{ runner.temp }}/pack
        run: |
          NPM_VERSION="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$NPM_VERSION" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $NPM_VERSION no soporta trusted publishing (hace falta 11.5.1 o superior)"
            exit 1
          fi
          npm publish ./*.tgz --provenance --access public --tag ${{ steps.version.outputs.npm_tag }}
        env:
          # Solo respaldo mientras el trusted publisher no esté configurado; con él, npm usa OIDC y no lee el token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
